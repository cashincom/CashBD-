<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CashBD</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #08090d;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      background: #111218;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .login {
      background: linear-gradient(90deg, #ff1744, #ff7a00);
      color: white;
      padding: 12px 22px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 75px 20px 50px;
    }

    .badge {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid #333;
      border-radius: 25px;
      color: #aaa;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 42px;
      line-height: 1.2;
      margin-bottom: 18px;
    }

    h1 span {
      color: #ff4b22;
    }

    .subtitle {
      color: #aaa;
      font-size: 17px;
      margin-bottom: 35px;
    }

    .start {
      display: block;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      border-radius: 40px;
      background: linear-gradient(90deg, #ff1744, #ff7a00);
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      padding: 25px;
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: #17181e;
      border: 1px solid #292a31;
      border-radius: 20px;
      padding: 25px 15px;
      text-align: center;
    }

    .number {
      font-size: 28px;
      font-weight: bold;
      color: #ff4b45;
      margin-bottom: 8px;
    }

    .card p {
      color: #aaa;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">💰 CashBD</div>
    <a href="#" class="login">লগইন</a>
  </header>

  <section class="hero">
    <div class="badge">🛡️ নিরাপদ ডিজিটাল প্ল্যাটফর্ম</div>

    <h1>
      আপনার ডিজিটাল আয়ের<br>
      <span>এক নতুন বিশ্ব</span>
    </h1>

    <p class="subtitle">
      CashBD — সহজ ও সুন্দর অনলাইন কনটেন্ট প্ল্যাটফর্ম
    </p>

    <a href="#" class="start">⚡ শুরু করুন</a>
  </section>

  <section class="cards">
    <div class="card">
      <div class="number">১০০০+</div>
      <p>কমিউনিটি সদস্য</p>
    </div>

    <div class="card">
      <div class="number">২৪/৭</div>
      <p>অনলাইন সেবা</p>
    </div>

    <div class="card">
      <div class="number">১০০%</div>
      <p>মূল কনটেন্ট</p>
    </div>

    <div class="card">
      <div class="number">সহজ</div>
      <p>ব্যবহারযোগ্য প্ল্যাটফর্ম</p>
    </div>
  </section>

  <footer>
    © 2026 CashBD — All Rights Reserved
  </footer>

</body>
  </html>
